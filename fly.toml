# fly.toml app configuration file for goodlife-gateway-fabric
app = 'goodlife-gateway-fabric'
primary_region = 'syd'

[build]
  # TRICK: Points to a clean, pre-built public python image to completely skip compilation queues
  image = "python:3.11-slim"

[env]
  # Injects your runtime paths into the pre-made container layer smoothly
  PYTHONPATH = "/opt/odynex-axis-matrix"
  DEBIAN_FRONTEND = "noninteractive"
  PYTHONUNBUFFERED = "1"

[experimental]
  # Tells the platform to launch your exact script as soon as the node boots up
  entrypoint = ["python3", "core-kernel/deterministic_engine.py"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
