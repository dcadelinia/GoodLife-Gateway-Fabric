# fly.toml app configuration file for goodlife-gateway-fabric
app = 'goodlife-gateway-fabric'
primary_region = 'syd'

[build]
  # OVERRIDE: Tells Fly.io to ignore the panel's bad image tags and pull a clean system layer
  image = "python:3.11-slim"

[env]
  PYTHONPATH = "/opt/odynex-axis-matrix"
  DEBIAN_FRONTEND = "noninteractive"
  PYTHONUNBUFFERED = "1"

[experimental]
  # Automatically triggers your central system core matrix on startup
  entrypoint = ["python3", "core-kernel/deterministic_engine.py"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
