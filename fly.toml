# fly.toml app configuration file for GoodLife Gateway Fabric
app = "goodlife-gateway-fabric"
primary_region = "iad"

[build]
  # Overrides and blocks account builders like fly-builder-tranquil-valley-1715
  builder = "none"
  image = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
