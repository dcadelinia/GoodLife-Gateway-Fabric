# fly.toml app configuration file for goodlife-gateway-fabric

app = "goodlife-gateway-fabric"
primary_region = "syd"

[build]
  image = "python:3.11-slim"

[env]
  PYTHONPATH = "/opt/odynex-axis-matrix"
  DEBIAN_FRONTEND = "noninteractive"
  PYTHONUNBUFFERED = "1"

[experimental]
  entrypoint = ["python3", "core-kernel/deterministic_engine.py"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
