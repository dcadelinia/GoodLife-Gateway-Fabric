version: "1.0"
blueprint_metadata:
  name: "goodlife-gateway-fabric-state-loops"
  description: "Safe state evaluation and execution layout for trade automation loops on Fly.io"

safety_limits:
  max_loop_duration_seconds: 300      
  cooldown_interval_seconds: 5        
  max_retries_per_state: 3            
  backoff_multiplier: 2.0             

execution_loops:
  - id: "primary_trade_evaluator"
    description: "Evaluates external gateway states and executes scheduled actions"
    trigger: "continuous"             
    
    pre_flight_checks:
      - check_network_connectivity: true
      - verify_external_gateway_sync: true
      - check_memory_threshold: "85%" 

    loop_sequence:
      - step: "fetch_latest_state"
        timeout_seconds: 15
        on_failure: "retry"
      - step: "process_fabric_logic"
        timeout_seconds: 45
        on_failure: "fallback_to_safe_state"
      - step: "commit_state_payload"
        timeout_seconds: 10
        on_failure: "rollback_and_alert"
      # FIX: Injected infrastructure ping to satisfy fly.toml [[http_service.checks]]
      - step: "emit_http_heartbeat"
        timeout_seconds: 2
        on_failure: "log_warning"

    platform_handlers:
      # FIX: Fly.io gives machines exactly 5 seconds by default to shut down after SIGTERM. 
      # We explicitly map this out so the application drains state instantly.
      on_sigterm: "immediate_graceful_drain_5s"    
      on_sigkill: "force_unlock"      
      allow_concurrent_loops: false   

error_handling_policies:
  fallback_to_safe_state:
    action: "reset_to_last_known_good"
    clear_local_cache: true
    notify_admin: true
  
  rollback_and_alert:
    action: "abort_transaction"
    release_distributed_locks: true
    severity: "CRITICAL"
