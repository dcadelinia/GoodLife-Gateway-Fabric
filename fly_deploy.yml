name: Fly.io Local Build and Deploy Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  deploy-gateway-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and Deploy to Fly.io
        # FIXED: Removed the broken --image tag so Fly.io compiles your real files cleanly
        run: |
          flyctl deploy --local-only -a goodlife-gateway-fabric --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
