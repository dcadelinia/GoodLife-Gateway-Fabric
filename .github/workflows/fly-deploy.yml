name: Deploy GoodLife Gateway Fabric

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Fly.io
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy application
        run: flyctl deploy --app goodlife-gateway-fabric --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
