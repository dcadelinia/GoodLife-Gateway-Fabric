name: Ultimate Fly.io Registry Overwrite Pipeline

on:
  push:
    branches: [ main, development ]
  workflow_dispatch: # Allows you to trigger this manually if needed

jobs:
  build-and-inject-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate with Fly.io Registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Pre-build and Inject Panel Tags
        # This compiles your Sophon & Python layers and pushes them directly to the registry path where the 404 is happening
        run: |
          docker build -t registry.fly.io/goodlife-gateway-fabric:deployment-6280669908d39c6e7131663e0ee17b2b .
          docker push registry.fly.io/goodlife-gateway-fabric:deployment-6280669908d39c6e7131663e0ee17b2b
