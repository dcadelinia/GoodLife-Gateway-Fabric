name: Fly.io Registry Image Injector

on:
  push:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  inject-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate with Fly.io Registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Pre-build and Push Exact Tag
        # This builds your Dockerfile locally on GitHub and pushes it to the exact tag your UI needs
        run: |
          docker build -t registry.fly.io/goodlife-gateway-fabric:deployment-53a5bb189759ae94239b38022bc79713 .
          docker push registry.fly.io/goodlife-gateway-fabric:deployment-53a5bb189759ae94239b38022bc79713
