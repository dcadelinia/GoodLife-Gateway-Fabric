# defense/safe_state_loops.yaml
# Blueprint configuration aligned with fabric gateway status

version: "1.0"
status: "ONLINE"
fabric_verification: "SUCCESS"

layout:
  blueprint: "system-metric-validation"
  environment: "fly.io"
  gateway_url: "https://fly.dev"

subsystems:
  omni_service: "OPERATIONAL"

metrics:
  - loop_id: "hardware_acceleration_simulation"
    runtime: "Python 3.11"
    enabled: true
    check_deterministic_reality: true
    synchronize_prior_art_timestamps: true

  - loop_id: "validate_framework_core"
    fail_on_missing_config: true
    retry_policy:
      max_attempts: 3
      backoff: "exponential"
